name: Publish AUR Package

on:
  push:
    tags:
      - 'v*' # Запускать при пуше тегов, начинающихся с "v"
  workflow_dispatch:   # <-- Добавьте эту строку

jobs:
  aur-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Шаг для динамического обновления pkgver в PKGBUILD (опционально)
      - name: Update pkgver in PKGBUILD
        run: |
          # Берем имя тега (или ветки, если запущено вручную)
          VERSION="${{ github.ref_name }}"
          # Убираем 'v' в начале, если оно есть (например, v1.0.0 -> 1.0.0)
          VERSION="${VERSION#v}"
          
          # Если запущено вручную на ветке main, VERSION будет "main" - в этом случае просто пропускаем обновление версии
          if [ "$VERSION" != "main" ] && [ "$VERSION" != "master" ]; then
            sed -i "s/^pkgver=.*/pkgver=$VERSION/" PKGBUILD
            echo "Updated pkgver to $VERSION"
          else
            echo "Manual run on branch. Keeping existing pkgver in PKGBUILD."
          fi

      - name: Publish AUR package
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: mp3-browser
          pkgbuild: ./PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to version ${{ github.ref_name }}"
          updpkgsums: true # Автоматически обновить контрольные суммы
          # test: true # Раскомментируйте, чтобы действие проверяло сборку пакета перед пушем (рекомендуется)
